<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Villager0090818">
    <title>Test web-site</title>
    <style>
        .lines{
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background-size: 40px 40px;
            background-image:
                    linear-gradient(to right,rgba(0,255,0,1) 1px,transparent 1px),
                    linear-gradient(to bottom,rgba(0,255,0,1) 1px,transparent 1px);
            animation: fly-lines 4.8s infinite alternate;
            filter: drop-shadow(0px 0px 5px rgba(0, 255,0, 0.7));
            filter: blur(2px);

            transition: opacity 0.3s,visibility 0.3s;
        }
        .lines-off{
            opacity: 0;
            visibility: hidden;
        }
        body{
            background-image: linear-gradient(0deg, #020, #000);
            background-position: center;
            background-attachment: fixed;
            background-size:cover;
            z-index: 2;
            background-color: black;
            color: rgba(0,255,0,0.5);
            transition: background-image 0.5s ease-in-out;
        }
        h1,h2,h3,h4,h5,h6,input,hr{
            background-color: rgba(0,0,0,0.5);
            border: none;
            border-radius: 10px;
            text-shadow: 5px 5px 5px #000000;
            padding: 6px 6px;
            transition: all 0.5s;
        }
        body.has-bg .lines {
            display: none;
        }
        hr{
            height: 10px;
            background-color: rgba(0,255,0,0.5);
            border: none;
            width: 97vw;
            position: absolute;
            animation: hr-scale 1s infinite normal;
        }
        button:hover,input:hover{
            transform: scale(1.1);
            box-shadow: 0 0 0 1px white;
            background-color: rgba(0,0,0,0.7);
        }
        button:active{
            transform: scale(0.9);
        }
        button{
            background-color: rgba(0,0,0,0.5);
            border-radius: 9px;
            padding: 5px 15px;
            color: white;
            border: none;
            transition: all 0.3s;
        }
        @keyframes hr-scale {
            0%{
                height: 10px;
            }
            50%{
                height: 5px;
            }
            100%{
                height: 2px;
            }
        }
        h6{
            filter: blur(1px)
        }
        @keyframes fly-lines {
            0%{
                background-position: 0 0;
            }
            25%{
                background-position: 100px 0;
            }
            50%{
                background-position: 100px 100px;
            }
            75%{
                background-position: 0 100px;
            }
            100%{
                background-position: 0 0;
            }
        }
    </style>
</head>

<!DOCTYPE html>
<html lang="ru">
<head>
   <meta charset="UTF-8">
   <meta name="author" content="Villager0090818">
   <title>Test web-site</title>
</head>
<body>

</body>
</html>


        </textarea>

<br>
<button title="У вас откроется вкладка с вашей веб страницей" id="open">
    <strong style="color: white">Нажмите для тестирования</strong>
</button>



<button title="Скачать веб страницу" id="safe">
    <strong style="color: white">Установить</strong>
</button>


<h3 class="colorReplace">
    Можете выбрать обои на фон и цвет слов <small>(которые пропадут после обновления страницы)</small>
</h3>

<input type="file" id="oboi" class="colorReplace">

<input type="color" id="wordcolor" class="colorReplace" value="#00FF00">

<button id="oboiset">Установить</button>

<button id="reset">Растворить сетку на фоне</button>

<br>
<h3 class="colorReplace">Ползунки для блюра сетки и градиента на фоне</h3>
<table>

    <td>
        <input class="blur" type="range" min="0" max="100" value="2" title="Ползунок блюра">

        <input class="gradient" type="range" min="0" max="15" value="2" title="Ползунок градиента">
    </td>
</table>



<script>




    if(window.screen.width <= 1000){
        document.querySelector('.lines').style.animation = 'none';
        document.querySelector('hr').style.animation = 'none';
    }



    const buttonOPEN = document.querySelector('#open');


    const resetButton = document.querySelector('#reset')


    let codeHTML = document.querySelector('#htmlcode');



    let blob = new Blob([codeHTML], {type: "text/html;charset=utf-8"});



    let blobURL = URL.createObjectURL(blob);



    const buttonSafe = document.querySelector('#safe');



    const fileOboi = document.querySelector('#oboi');


    const blur = document.querySelector('.blur');


    const gradient = document.querySelector('.gradient');



    const buttonOboi = document.querySelector('#oboiset');



    const replaceColor = document.querySelectorAll('.colorReplace');



    const color = document.querySelector('#wordcolor');

    <!--Метод обновления информации о тексте и тд-->
    function updateInfo() {
        codeHTML = document.querySelector('#htmlcode').value;

        blob = new Blob([codeHTML], {type: "text/html;charset=utf-8"});

        blobURL = URL.createObjectURL(blob);

    }


    let off = false;
    resetButton.addEventListener('click',()=>{
        document.body.querySelector('.lines').classList.toggle('lines-off');
        off = !off;
        if(off)
            resetButton.textContent = "Выявить сетку"
        else
            resetButton.textContent = "Растворить сетку на фоне"
    })



    codeHTML.addEventListener('keydown', function(e) {
        if (e.key === 'Tab') {
            e.preventDefault();

            const start = this.selectionStart;
            const end = this.selectionEnd;

            const spaces = '     ';

            this.value = this.value.substring(0, start) + spaces + this.value.substring(end);

            this.selectionStart = this.selectionEnd = start + spaces.length;
        }
    });





    const saveCode = localStorage.getItem('compiler.html.code')
    if(saveCode != null && saveCode != 'undefined'){
        codeHTML.value = saveCode;
    }



    let on = false;
    let prov = "";

    codeHTML.addEventListener('input', (e) => {
        let nowChar = e.data;

        if (nowChar === "<") {
            on = true;
        }if (on) {
            if (nowChar) {
                prov = prov + nowChar;
            }
        }if (nowChar === ">" && on) {
            let cleanTag = prov.replace("<", "").replace(">", "").trim();

            let tagName = cleanTag.split(" ")[0];


            if (!tagName.startsWith("/")) {

                let closingTag = "</" + tagName + ">";

                const cursorPos = codeHTML.selectionStart;

                const textBefore = codeHTML.value.substring(0, cursorPos);
                const textAfter = codeHTML.value.substring(cursorPos);

                codeHTML.value = textBefore + closingTag + textAfter;

                codeHTML.selectionStart = cursorPos;
                codeHTML.selectionEnd = cursorPos;
            }

            on = false;
            prov = "";
        }

        if (!on) prov = "";

        localStorage.setItem('compiler.html.code', codeHTML.value);
    });





    gradient.addEventListener('input',()=>{
        const color = Number(gradient.value).toString(16);
        document.body.style.backgroundImage = 'linear-gradient(0deg, #0' + color + '0, #000)';
    })



    blur.addEventListener('input',()=>{
        document.querySelector('.lines').style.filter = 'blur(' + blur.value + 'px)';
    })





    function LogicButtonOpen() {

        updateInfo();

        const newWindow = window.open(blobURL, '_blank');

        setTimeout(() => URL.revokeObjectURL(blobURL), 1000);

    }





    function SafeButton() {
        updateInfo();
        const link = document.createElement('a');
        link.href = blobURL;

        link.download = "my_new_page.html";
        link.click();
    }




    buttonOPEN.addEventListener(('click'), () => {
        LogicButtonOpen();
    });




    buttonSafe.addEventListener(('click'), () => {
        SafeButton();
    });





    buttonOboi.addEventListener('click', () => {

        let fr = new FileReader();
        replaceColor.forEach((element)=>{
            element.style.color = color.value;
            if(element.tagName === 'HR'){
                element.style.setProperty('background-color', color.value, 'important');
            }
        })

        fr.onload = function (e) {
            let result = e.target.result;
            result = `url('${result}')`;
            document.body.style.backgroundImage = result;
            document.body.classList.add('has-bg');
            console.log(link)
        };

        if(fileOboi.files[0] != null)
            fr.readAsDataURL(fileOboi.files[0])
    })

</script>
</body>
</html>
